<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <title>Myntra Clone</title>
</head>
<body>

    <header>
        <div class="logo">
            <a href="#"><img class = "MyntraLogo"src="images/myntra_logo.webp" alt="Myntra Logo"></a>
        </div>
        <nav class="navBar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio <sup>NEW</sup></a>
        </nav>
        <div class="searchBar">
            <span class="material-symbols-outlined searchIcon">
search
</span>
            <input class="searchInput" placeholder="Search for products, brands and more">
        </div>
        <div class="actionBar">
            <div class="actionBox">
                <span class="material-symbols-outlined actionIcon">
person
</span>
                <span class="actionName">Profile</span>
            </div>
            
            <div class="actionBox">
<span class="material-symbols-outlined actionIcon">favorite</span>
                <span class="actionName">Wishlist</span>
            </div>

            <div class="actionBox">
                <span class="material-symbols-outlined actionIcon">
shopping_bag
</span>
                <span class="actionName">Bag</span>
            </div>
        </div>
    </header>
    <main>
        <div class="bannerContainer">
            <img class="bannerImage" src="images/banner.jpg" alt="Banner Image">
        </div>
        <div class="categoryHeading">MEDAL WORTHY BRANDS TO BAG</div>
        <div class="categoryItems">
            <a href="#"><img class="Offers" src="images/offers/1.png" ></a>

            <a href="#"><img class="Offers" src="images/offers/7.png" ></a>
            <a href="#"><img class="Offers" src="images/offers/8.png" ></a> 
            <a href="#"><img class="Offers" src="images/offers/9.png" ></a>
            <a href="#"><img class="Offers" src="images/offers/10.png" ></a>
            <a href="#"><img class="Offers" src="images/offers/11.png" ></a>
            <a href="#"><img class="Offers" src="images/offers/12.png" ></a>      
        </div>

        <div class="categoryHeading">shop by category</div>
        <div class="categoryItems">
            <a href="#"><img class="Offers" src="images/categories/1.jpg" ></a>
            <a href="#"><img class="Offers" src="images/categories/2.jpg" ></a>

            <a href="#"><img class="Offers" src="images/categories/9.jpg" ></a>
            <a href="#"><img class="Offers" src="images/categories/10.jpg" ></a>     
        </div>

    </main>
    <footer></footer>
